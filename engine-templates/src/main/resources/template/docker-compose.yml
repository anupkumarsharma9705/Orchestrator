services:
  {{serviceName}}:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: {{serviceName}}
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/{{dbName}}
      - DB_USERNAME=${DB_USERNAME:-{{dbUser}}}
      # Required - compose refuses to start without a database password.
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (at least 32 bytes)}
      - JWT_ISSUER=${JWT_ISSUER:-companion}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - {{serviceName}}-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: {{serviceName}}-postgres
    environment:
      - POSTGRES_DB={{dbName}}
      - POSTGRES_USER=${DB_USERNAME:-{{dbUser}}}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      # Bind to the loopback interface so the database is not exposed to the
      # local network by default.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - {{serviceName}}-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-{{dbUser}}} -d {{dbName}}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  {{serviceName}}-network:
    driver: bridge