name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: "-Xmx2g -XX:+UseG1GC"
  JAVA_VERSION: "21"
  # Test-only signing key. Real deployments must provide their own secret.
  JWT_SECRET: "0123456789abcdef0123456789abcdef"

jobs:
  build-and-test:
    name: Build, Test & Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Empty when the secret is not configured; the optional scan checks it.
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: {{artifactId}}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Verify (tests, Checkstyle, SpotBugs, package)
        run: mvn -B -ntp verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/{{artifactId}}
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

      - name: OWASP Dependency-Check (optional)
        if: env.NVD_API_KEY != ''
        run: mvn -B -ntp -Psecurity dependency-check:check

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
