name: java-companion

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: companion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - run scripts/dev-up or copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companion -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Build the sandbox image once and exit. The server waits for this service
  # and its health indicator checks that the image exists.
  sandbox-image:
    build:
      context: ./engine-sandbox/src/main/resources/docker
      dockerfile: Dockerfile
    image: orchestrator/sandbox:1.0.0
    command: ["/bin/true"]
    restart: "no"

  # The server and sandbox containers are siblings. Give the shared workspace
  # volume to the server user so project files can be created and mounted.
  workspace-init:
    image: orchestrator/sandbox:1.0.0
    user: "0:0"
    command: ["/bin/sh", "-c", "mkdir -p /workspaces && chown -R 1001:1001 /workspaces"]
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    volumes:
      - orchestrator-workspace:/workspaces
    restart: "no"

  orchestrator-server:
    build:
      context: .
      dockerfile: orchestrator-server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
      workspace-init:
        condition: service_completed_successfully
    ports:
      - "${ORCHESTRATOR_PORT:-8443}:8443"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: companion
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:?ORCHESTRATOR_API_KEY is required}
      SSL_KEY_STORE: /certs/server-keystore.p12
      SSL_TRUST_STORE: /certs/truststore.p12
      SSL_KEY_STORE_PASSWORD: ${CERT_PASSWORD:?CERT_PASSWORD is required}
      SSL_TRUST_STORE_PASSWORD: ${CERT_PASSWORD:?CERT_PASSWORD is required}
      # OpenRouter is enabled by default and becomes available as soon as a
      # key is present. NVIDIA and Ollama remain optional providers.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ORCHESTRATOR_MODEL_ROUTER_PROVIDERS_OPENROUTER_ENABLED: ${ORCHESTRATOR_MODEL_ROUTER_PROVIDERS_OPENROUTER_ENABLED:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Projects and sandbox mounts both live below the shared volume.
      ORCHESTRATOR_WORKSPACE_ALLOWED_ROOTS: /workspaces
      ORCHESTRATOR_SANDBOX_WORKSPACE_ROOTS: /workspaces
      ORCHESTRATOR_SANDBOX_WORKSPACE_VOLUME: ${ORCHESTRATOR_WORKSPACE_VOLUME:-orchestrator-workspace}
      ORCHESTRATOR_SANDBOX_WORKSPACE_VOLUME_ROOT: /workspaces
    volumes:
      - ./certs:/certs:ro
      - orchestrator-workspace:/workspaces
      # Local-development convenience only. Mounting the host socket gives
      # the server root-equivalent control of the host. For production, use a
      # dedicated or remote Docker daemon over TLS instead (see docs).
      - /var/run/docker.sock:/var/run/docker.sock
    # The server container runs as uid 1001. Docker Desktop usually exposes
    # the socket as root:root; Linux hosts use the docker group. Set DOCKER_GID
    # to the socket's group id when it is not 0.
    group_add:
      - "${DOCKER_GID:-0}"
    healthcheck:
      # Application-level health over mTLS, not just a TLS handshake. The
      # response is DOWN when the database, migrations, sandbox, or image are
      # unhealthy.
      test:
        - CMD-SHELL
        - >-
          curl -fsS --max-time 5 --cert-type P12
          --cert "/certs/client-keystore.p12:$${SSL_KEY_STORE_PASSWORD}"
          --cacert /certs/ca.crt
          https://localhost:8443/actuator/health
          | grep -q '"status":"UP"'
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 45s
    restart: unless-stopped

volumes:
  postgres-data:
  orchestrator-workspace:
    name: ${ORCHESTRATOR_WORKSPACE_VOLUME:-orchestrator-workspace}
