version: '3.8'

services:
  test-final-all:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-final-all
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - test-final-all-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: test-final-all-postgres
    environment:
      - POSTGRES_DB=test-final-all
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - test-final-all-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test-final-all"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  test-final-all-network:
    driver: bridge