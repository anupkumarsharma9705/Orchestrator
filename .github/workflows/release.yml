name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify reactor
        run: mvn -B -ntp clean verify

      - name: Smoke test CLI
        run: java -jar app-cli/target/app-cli-*-exec.jar --help

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app-cli/target/app-cli-*-exec.jar dist/companion.jar

          cat > dist/install.sh <<'EOF'
          #!/usr/bin/env bash
          # Java Companion Orchestrator installer.
          # Usage: curl -fsSL https://github.com/REPO_PLACEHOLDER/releases/latest/download/install.sh | bash
          set -euo pipefail

          REPO="REPO_PLACEHOLDER"
          INSTALL_DIR="${COMPANION_INSTALL_DIR:-$HOME/.local/bin}"
          VERSION="${COMPANION_VERSION:-latest}"

          command -v java >/dev/null 2>&1 || {
            echo "Error: Java 21 or newer is required." >&2
            exit 1
          }
          command -v curl >/dev/null 2>&1 || {
            echo "Error: curl is required." >&2
            exit 1
          }

          if [ "$VERSION" = "latest" ]; then
            JAR_URL="https://github.com/${REPO}/releases/latest/download/companion.jar"
          else
            JAR_URL="https://github.com/${REPO}/releases/download/v${VERSION#v}/companion.jar"
          fi

          CHECKSUM_URL="${JAR_URL}.sha256"
          CHECKSUM_FILE="$INSTALL_DIR/companion.jar.sha256"

          mkdir -p "$INSTALL_DIR"
          echo "Downloading ${JAR_URL}..."
          curl -fsSL "$JAR_URL" -o "$INSTALL_DIR/companion.jar"
          curl -fsSL "$CHECKSUM_URL" -o "$CHECKSUM_FILE"

          EXPECTED=$(awk '{print $1}' "$CHECKSUM_FILE")
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum "$INSTALL_DIR/companion.jar" | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 "$INSTALL_DIR/companion.jar" | awk '{print $1}')
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Error: checksum verification failed for companion.jar" >&2
            exit 1
          fi
          rm -f "$CHECKSUM_FILE"

          cat > "$INSTALL_DIR/companion" <<WRAPPER
          #!/usr/bin/env bash
          exec java -jar "$INSTALL_DIR/companion.jar" "\$@"
          WRAPPER
          chmod +x "$INSTALL_DIR/companion"

          echo "Installed to $INSTALL_DIR/companion"
          echo "Run 'companion --help' to get started."
          echo "Add $INSTALL_DIR to PATH if it is not already there."
          EOF

          sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" dist/install.sh
          chmod +x dist/install.sh
          bash -n dist/install.sh

      - name: Verify JAR checksum
        run: sha256sum dist/companion.jar | tee dist/companion.jar.sha256

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/companion.jar
            dist/companion.jar.sha256
            dist/install.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
