name: Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  packages: write
  security-events: write  # For secret scanning SARIF upload

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build with Maven
        run: mvn -B clean package -pl app-cli -am -DskipTests

      - name: Verify JAR
        run: |
          JAR_PATH=$(find app-cli/target -name "*-exec.jar" | head -1)
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_ENV
          java -jar "$JAR_PATH" --help

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: --verbose --report-format=sarif --report-path=gitleaks.sarif
          config: .gitleaks.toml

      - name: Upload Secret Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-cli
          path: app-cli/target/*-exec.jar
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: companion-cli
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (Maven)
        if: false  # Enable when ready to publish to Maven Central
        run: |
          mvn deploy:deploy-file \
            -DgroupId=com.example \
            -DartifactId=companion-cli \
            -Dversion=${{ github.ref_name }} \
            -Dpackaging=jar \
            -Dfile=release/*.jar \
            -DrepositoryId=github \
            -Durl=https://maven.pkg.github.com/${{ github.repository_owner }}/java-companion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-script:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: companion-cli
          path: ./release

      - name: Generate install script
        run: |
          cat > install.sh << 'EOF'
          #!/bin/bash
          # Java Companion Orchestrator - Install Script
          # Usage: curl -sSL https://github.com/owner/repo/releases/latest/download/install.sh | bash

          set -euo pipefail

          REPO="owner/java-companion"
          INSTALL_DIR="${HOME}/.local/bin"
          JAR_NAME="companion.jar"

          # Get latest release version
          LATEST_VERSION=$(curl -s "https://api.github.com/repos/${REPO}/releases/latest" | grep '"tag_name"' | cut -d'"' -f4)
          if [ -z "${LATEST_VERSION}" ]; then
              echo "Error: Could not determine latest version"
              exit 1
          fi

          echo "Installing Java Companion Orchestrator ${LATEST_VERSION}..."

          # Create install directory
          mkdir -p "${INSTALL_DIR}"

          # Download JAR
          JAR_URL="https://github.com/${REPO}/releases/download/${LATEST_VERSION}/companion.jar"
          echo "Downloading from ${JAR_URL}..."
          curl -sSL "${JAR_URL}" -o "${INSTALL_DIR}/companion.jar"

          # Make executable
          chmod +x "${INSTALL_DIR}/companion.jar"

          # Add to PATH if not already
          if [[ ":${PATH}:" != *":${INSTALL_DIR}:"* ]]; then
              SHELL_RC=""
              if [ -n "${ZSH_VERSION:-}" ]; then
                  SHELL_RC="${HOME}/.zshrc"
              elif [ -n "${BASH_VERSION:-}" ]; then
                  SHELL_RC="${HOME}/.bashrc"
              fi

              if [ -n "${SHELL_RC}" ]; then
                  echo 'export PATH="${HOME}/.local/bin:${PATH}"' >> "${SHELL_RC}"
                  echo "Added ${INSTALL_DIR} to PATH in ${SHELL_RC}"
                  echo "Run 'source ${SHELL_RC}' or restart your shell"
              else
                  echo "Add ${INSTALL_DIR} to your PATH manually"
              fi
          fi

          echo "Installation complete! Run 'companion --help' to get started."
          echo "Or run: java -jar ${INSTALL_DIR}/companion.jar --help"
          EOF

      - name: Upload install script
        uses: actions/upload-artifact@v4
        with:
          name: install-script
          path: install.sh
          retention-days: 30

      - name: Attach install script to release
        uses: softprops/action-gh-release@v2
        with:
          files: install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}