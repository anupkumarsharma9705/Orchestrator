name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is required for signed releases"
            exit 1
          fi
          mkdir -p "$HOME/.gnupg"
          chmod 700 "$HOME/.gnupg"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Verify and sign reactor
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease-signing clean verify

      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

      - name: Smoke test CLI
        run: java -jar app-cli/target/app-cli-*-exec.jar --help

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app-cli/target/app-cli-*-exec.jar dist/companion.jar
          cp target/sbom.json dist/sbom.json

          cat > dist/install.sh <<'EOF'
          #!/usr/bin/env bash
          # Java Companion Orchestrator installer.
          # Usage: curl -fsSL https://github.com/REPO_PLACEHOLDER/releases/latest/download/install.sh | bash
          set -euo pipefail

          REPO="REPO_PLACEHOLDER"
          INSTALL_DIR="${COMPANION_INSTALL_DIR:-$HOME/.local/bin}"
          VERSION="${COMPANION_VERSION:-latest}"

          command -v java >/dev/null 2>&1 || {
            echo "Error: Java 21 or newer is required." >&2
            exit 1
          }
          command -v curl >/dev/null 2>&1 || {
            echo "Error: curl is required." >&2
            exit 1
          }

          if [ "$VERSION" = "latest" ]; then
            JAR_URL="https://github.com/${REPO}/releases/latest/download/companion.jar"
          else
            JAR_URL="https://github.com/${REPO}/releases/download/v${VERSION#v}/companion.jar"
          fi

          CHECKSUM_URL="${JAR_URL}.sha256"
          CHECKSUM_FILE="$INSTALL_DIR/companion.jar.sha256"

          mkdir -p "$INSTALL_DIR"
          echo "Downloading ${JAR_URL}..."
          curl -fsSL "$JAR_URL" -o "$INSTALL_DIR/companion.jar"
          curl -fsSL "$CHECKSUM_URL" -o "$CHECKSUM_FILE"

          EXPECTED=$(awk '{print $1}' "$CHECKSUM_FILE")
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL=$(sha256sum "$INSTALL_DIR/companion.jar" | awk '{print $1}')
          else
            ACTUAL=$(shasum -a 256 "$INSTALL_DIR/companion.jar" | awk '{print $1}')
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Error: checksum verification failed for companion.jar" >&2
            exit 1
          fi
          rm -f "$CHECKSUM_FILE"

          cat > "$INSTALL_DIR/companion" <<WRAPPER
          #!/usr/bin/env bash
          exec java -jar "$INSTALL_DIR/companion.jar" "\$@"
          WRAPPER
          chmod +x "$INSTALL_DIR/companion"

          echo "Installed to $INSTALL_DIR/companion"
          echo "Run 'companion --help' to get started."
          echo "Add $INSTALL_DIR to PATH if it is not already there."
          EOF

          sed -i "s|REPO_PLACEHOLDER|${{ github.repository }}|g" dist/install.sh
          chmod +x dist/install.sh
          bash -n dist/install.sh

      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum companion.jar > companion.jar.sha256
          sha256sum companion.jar sbom.json install.sh > SHA256SUMS
          sha256sum --check companion.jar.sha256
          sha256sum --check SHA256SUMS

      - name: Sign release assets
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          passfile=$(mktemp)
          trap 'rm -f "$passfile"' EXIT
          chmod 600 "$passfile"
          printf '%s' "${GPG_PASSPHRASE:-}" > "$passfile"

          for file in dist/companion.jar dist/sbom.json dist/SHA256SUMS dist/install.sh; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase-file "$passfile" --armor --detach-sign "$file"
          done

          for signature in dist/*.asc; do
            gpg --batch --verify "$signature" "${signature%.asc}"
          done

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: |
            dist/companion.jar
            dist/sbom.json
            dist/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3
        with:
          files: |
            dist/companion.jar
            dist/companion.jar.sha256
            dist/companion.jar.asc
            dist/sbom.json
            dist/sbom.json.asc
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
            dist/install.sh
            dist/install.sh.asc
          generate_release_notes: true
          fail_on_unmatched_files: true
