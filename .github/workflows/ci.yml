name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and verify
        run: mvn -B -ntp clean verify

      - name: Generate CycloneDX SBOM
        run: mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom-${{ matrix.os }}
          path: target/sbom.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7

  generated-project:
    name: Generate offline and verify generated project
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build CLI
        run: mvn -B -ntp -pl app-cli -am package -DskipTests

      - name: Generate project without server or LLM
        run: |
          set -euo pipefail
          GEN_ROOT="$RUNNER_TEMP/companion-generation"
          rm -rf "$GEN_ROOT"
          mkdir -p "$GEN_ROOT/home"
          java -Duser.home="$GEN_ROOT/home" \
            -jar app-cli/target/app-cli-0.0.1-SNAPSHOT-exec.jar \
            --no-color generate \
            "REST CRUD for Book entity with author, genre, ISBN, pagination, validation" \
            --name library --offline --project-root "$GEN_ROOT"
          test -f "$GEN_ROOT/library/pom.xml"

      - name: Assert generated defaults
        run: |
          set -euo pipefail
          GEN_ROOT="$RUNNER_TEMP/companion-generation/library"
          grep -q '<version>4.1.1</version>' "$GEN_ROOT/pom.xml"
          grep -q 'spring-boot-flyway' "$GEN_ROOT/pom.xml"
          ! grep -q 'write-dates-as-timestamps' "$GEN_ROOT/src/main/resources/application.yml"
          test -f "$GEN_ROOT/src/main/java/com/example/library/config/SecurityConfig.java"

      - name: Verify generated project
        working-directory: ${{ runner.temp }}/companion-generation/library
        run: mvn -B -ntp verify

  dependency-scan:
    name: Dependency scan (OWASP)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Cache dependency-check data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-${{ runner.os }}-

      - name: Run OWASP dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${NVD_API_KEY:-}" ]; then
            mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:aggregate -DnvdApiKey="$NVD_API_KEY"
          else
            echo "::warning::NVD_API_KEY is not configured; dependency-check will use the slower anonymous NVD feed."
            mvn -B -ntp org.owasp:dependency-check-maven:13.0.0:aggregate
          fi

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
          retention-days: 7

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
