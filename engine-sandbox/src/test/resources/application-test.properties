spring.main.allow-bean-definition-overriding=true

orchestrator.sandbox.docker-image=orchestrator/sandbox:1.0.0
orchestrator.sandbox.docker-host=unix:///var/run/docker.sock
orchestrator.sandbox.default-timeout-seconds=300
orchestrator.sandbox.max-timeout-seconds=3600
orchestrator.sandbox.memory-limit-mb=2048
orchestrator.sandbox.cpu-limit-cores=2
orchestrator.sandbox.max-processes=100
orchestrator.sandbox.maven-cache-volume=orchestrator-maven-cache
orchestrator.sandbox.workspace-mount-path=/workspace
orchestrator.sandbox.enable-network=false
orchestrator.sandbox.enable-dependency-prefetch=true
orchestrator.sandbox.dependency-prefetch-timeout-seconds=900
orchestrator.sandbox.allowed-registries=docker.io,ghcr.io
orchestrator.sandbox.denied-registries=malicious.registry.com
orchestrator.sandbox.require-explicit-tag=true
orchestrator.sandbox.allowed-tags=1.0.0,1.0.1,stable
orchestrator.sandbox.denied-image-patterns=*:latest,*:dev-*,malicious/*
orchestrator.sandbox.allowed-docker-hosts=unix:///var/run/docker.sock,unix:///run/docker.sock,npipe:////./pipe/docker_engine
orchestrator.sandbox.require-tls-for-tcp=true
orchestrator.sandbox.allowed-capabilities=
orchestrator.sandbox.denied-capabilities=CAP_SYS_ADMIN,CAP_SYS_RESOURCE,CAP_SYS_MODULE,CAP_SYS_RAWIO,CAP_SYS_PACCT,CAP_SYS_NICE,CAP_SYSLOG,CAP_DAC_READ_SEARCH,CAP_LINUX_IMMUTABLE,CAP_MAC_ADMIN,CAP_MAC_OVERRIDE,CAP_BPF,CAP_PERFMON,CAP_CHECKPOINT_RESTORE
orchestrator.sandbox.security-opts=no-new-privileges:true
orchestrator.sandbox.apparmor-profile=docker-default
orchestrator.sandbox.seccomp-profile=default