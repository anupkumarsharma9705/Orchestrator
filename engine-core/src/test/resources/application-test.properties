spring.main.allow-bean-definition-overriding=true

orchestrator.model-router.default-provider=test
orchestrator.model-router.providers.nvidia.enabled=false
orchestrator.model-router.providers.openrouter.enabled=false
orchestrator.model-router.providers.ollama.enabled=false
orchestrator.model-router.providers.test.enabled=true
orchestrator.model-router.default-profile=general

orchestrator.model-router.profiles.general.provider=test
orchestrator.model-router.profiles.general.model=test-model
orchestrator.model-router.profiles.general.temperature=0.5
orchestrator.model-router.profiles.general.max-tokens=4096
orchestrator.model-router.profiles.general.top-p=0.95
orchestrator.model-router.profiles.general.system-prompt=You are a helpful AI assistant.
orchestrator.model-router.profiles.general.enabled=true
orchestrator.model-router.profiles.general.fallback-profiles=

orchestrator.model-router.profiles.planner.provider=test
orchestrator.model-router.profiles.planner.model=test-model
orchestrator.model-router.profiles.planner.temperature=0.1
orchestrator.model-router.profiles.planner.max-tokens=4096
orchestrator.model-router.profiles.planner.top-p=0.9
orchestrator.model-router.profiles.planner.system-prompt=You are an expert software architect. Create detailed, actionable implementation plans.
orchestrator.model-router.profiles.planner.enabled=true
orchestrator.model-router.profiles.planner.fallback-profiles=coder,general

orchestrator.model-router.profiles.coder.provider=test
orchestrator.model-router.profiles.coder.model=test-model
orchestrator.model-router.profiles.coder.temperature=0.2
orchestrator.model-router.profiles.coder.max-tokens=8192
orchestrator.model-router.profiles.coder.top-p=0.95
orchestrator.model-router.profiles.coder.system-prompt=You are an expert software engineer. Write clean, correct, production-ready code.
orchestrator.model-router.profiles.coder.enabled=true
orchestrator.model-router.profiles.coder.fallback-profiles=reviewer,general

orchestrator.model-router.profiles.reviewer.provider=test
orchestrator.model-router.profiles.reviewer.model=test-model
orchestrator.model-router.profiles.reviewer.temperature=0.1
orchestrator.model-router.profiles.reviewer.max-tokens=4096
orchestrator.model-router.profiles.reviewer.top-p=0.9
orchestrator.model-router.profiles.reviewer.system-prompt=You are a senior code reviewer. Find bugs, security issues, and suggest improvements.
orchestrator.model-router.profiles.reviewer.enabled=true
orchestrator.model-router.profiles.reviewer.fallback-profiles=general

orchestrator.model-router.profiles.security_reasoning.provider=test
orchestrator.model-router.profiles.security_reasoning.model=test-model
orchestrator.model-router.profiles.security_reasoning.temperature=0.0
orchestrator.model-router.profiles.security_reasoning.max-tokens=4096
orchestrator.model-router.profiles.security_reasoning.top-p=1.0
orchestrator.model-router.profiles.security_reasoning.system-prompt=You are a security expert. Find vulnerabilities, injection flaws, security anti-patterns, exposed secrets, unsafe configuration, and insecure dependencies.
orchestrator.model-router.profiles.security_reasoning.enabled=true
orchestrator.model-router.profiles.security_reasoning.fallback-profiles=reviewer,general

orchestrator.model-router.profiles.documentation.provider=test
orchestrator.model-router.profiles.documentation.model=test-model
orchestrator.model-router.profiles.documentation.temperature=0.3
orchestrator.model-router.profiles.documentation.max-tokens=4096
orchestrator.model-router.profiles.documentation.top-p=0.9
orchestrator.model-router.profiles.documentation.system-prompt=You are a technical writer. Create clear, accurate, concise technical documentation.
orchestrator.model-router.profiles.documentation.enabled=true
orchestrator.model-router.profiles.documentation.fallback-profiles=general

orchestrator.model-router.profiles.clarifier.provider=test
orchestrator.model-router.profiles.clarifier.model=test-model
orchestrator.model-router.profiles.clarifier.temperature=0.1
orchestrator.model-router.profiles.clarifier.max-tokens=4096
orchestrator.model-router.profiles.clarifier.top-p=0.9
orchestrator.model-router.profiles.clarifier.system-prompt=You are an expert software architect who helps clarify vague software requirements. Ask specific, targeted questions that resolve architectural ambiguity. Return questions as a JSON array only - no markdown, no extra text. Each question must have: id, question, default, type (SELECT/INPUT/BOOLEAN), options.
orchestrator.model-router.profiles.clarifier.enabled=true
orchestrator.model-router.profiles.clarifier.fallback-profiles=planner,general

orchestrator.clarifier.system-prompt=You are an expert software architect who helps clarify vague software requirements. Ask specific, targeted questions that resolve architectural ambiguity. Return questions as a JSON array only - no markdown, no extra text. Each question must have: id, question, default, type (SELECT/INPUT/BOOLEAN), options.