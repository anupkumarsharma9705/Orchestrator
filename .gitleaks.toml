# Gitleaks configuration for Java Companion Orchestrator.
# Valid TOML for gitleaks v8.25+ ([[allowlists]], not the deprecated [allowlist]).
# Default rules are extended with product-specific patterns; test fixtures,
# documentation placeholders, and build output are allowlisted so real
# credentials still fail the build.

title = "Java Companion Orchestrator - Secret Detection"

[extend]
useDefault = true

[[rules]]
id = "companion-api-key"
description = "Hard-coded orchestrator API key"
regex = '''(?i)(?:orchestrator_api_key|companion_api_key|x-api-key)\s*[:=]\s*["']?[0-9a-f]{64}["']?'''
tags = ["key", "companion"]

[[rules]]
id = "companion-jwt-secret"
description = "Hard-coded JWT signing secret"
regex = '''(?i)jwt[_-]?secret\s*[:=]\s*["']?[A-Za-z0-9+/=_-]{32,}["']?'''
tags = ["secret", "jwt"]

[[allowlists]]
description = "Test data, fixtures, docs samples, detector sources, and build output"
paths = [
  '''(^|/)src/test/''',
  '''(^|/)src/it/''',
  '''(^|/)target/''',
  '''(^|/)build/''',
  '''(^|/)node_modules/''',
  '''(^|/)docs/build/''',
  '''(^|/)docs/\.docusaurus/''',
  '''(?i)(^|/)(fixtures|mocks?)/''',
  '''(?i).*(Test|Tests|Spec)\.(java|kt|groovy)$''',
  '''(?i)\.env\.example$''',
  '''SecretScanner\.java$''',
]
regexes = [
  '''(?i)test[-_]?(?:key|secret|token|password)''',
  '''(?i)(?:example|dummy|fake|mock|placeholder|sample)[-_]?(?:key|secret|token|password)?''',
  '''(?i)your[-_]''',
  '''(?i)replace[-_]with''',
  '''(?i)changeme|changethis''',
  '''0123456789abcdef0123456789abcdef''',
]
stopwords = [
  "test",
  "example",
  "dummy",
  "fake",
  "mock",
  "placeholder",
  "sample",
  "changeme",
  "changethis",
  "replace",
]
