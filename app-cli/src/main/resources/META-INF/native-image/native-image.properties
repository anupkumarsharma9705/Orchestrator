{
  "mainClass": "com.example.orchestrator.cli.CompanionCli",
  "imageName": "companion",
  "buildArgs": [
    "--enable-url-protocols=http,https",
    "--initialize-at-build-time=org.springframework,org.yaml.snakeyaml,com.fasterxml.jackson.databind",
    "--initialize-at-run-time=org.springframework.boot,org.springframework.context",
    "-H:+ReportExceptionStackTraces",
    "-H:ConfigurationFileDirectories=src/main/resources/META-INF/native-image",
    "--no-fallback",
    "--enable-url-protocols=http,https",
    "--allow-incomplete-classpath",
    "--report-unsupported-elements-at-runtime"
  ],
  "buildOutputDirectory": "target/native",
  "skipTests": true
}